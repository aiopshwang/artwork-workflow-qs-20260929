function status(t){$('status').textContent=t;}function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}function setSize(){map.style.width=(W*zoom)+'px';map.style.height=(H*zoom)+'px';$('zoom-label').textContent=Math.round(zoom*100)+'%';document.body.classList.toggle('overview',zoom<.45);$('hint').innerHTML=zoom<.45?'전체 구조를 보는 축소 화면입니다. <b>읽기 크기</b> 또는 위 업무 구간을 눌러 글자를 읽어 주세요.':'<b>마우스로 잡아 끌어 이동</b>하고, 업무 상자를 클릭하면 설명을 봅니다. 휴대폰에서는 손가락으로 밀어 이동합니다.';updateRoles();}function screenCenter(){return{x:x0+(viewport.scrollLeft+viewport.clientWidth/2)/zoom,y:y0+(viewport.scrollTop+viewport.clientHeight/2)/zoom};}function scrollPoint(x,y,behavior='auto'){viewport.scrollTo({left:Math.max(0,(x-x0)*zoom-viewport.clientWidth/2),top:Math.max(0,(y-y0)*zoom-viewport.clientHeight/2),behavior});}function setZoom(value,point){const center=point||screenCenter();zoom=Math.max(.02,Math.min(2.3,value));setSize();scrollPoint(center.x,center.y);document.body.classList.toggle('overview',zoom<.45);$('hint').innerHTML=zoom<.45?'전체 구조를 보는 축소 화면입니다. <b>읽기 크기</b> 또는 위 업무 구간을 눌러 글자를 읽어 주세요.':'<b>마우스로 잡아 끌어 이동</b>하고, 업무 상자를 클릭하면 설명을 봅니다. 휴대폰에서는 손가락으로 밀어 이동합니다.';}
function setHash(value){const url=new URL(location.href);url.hash=value;history.replaceState(null,'',url);}function field(title,text){const box=element('section',undefined,'field');box.append(element('h3',title));box.append(element('p',text||'초안에 구체적인 자료가 별도 기재되지 않았습니다.',text?'':'empty'));return box;}function mark(n){highlight.hidden=false;highlight.removeAttribute('hidden');for(const[k,v]of Object.entries({x:n.x-8,y:n.y-8,width:n.w+16,height:n.h+16}))highlight.setAttribute(k,v);}
function questionBox(id){const q=questions.get(id);if(!q)return null;const box=element('section',undefined,'question-box');box.append(element('h3',id+' · 확인 필요'));box.append(element('p',q.text));box.append(element('small',q.status));return box;}
function showNode(id,{navigate=true,hash=true}={}){const n=nodeMap.get(id);if(!n)return false;selected=id;const body=$('detail-content');body.replaceChildren();$('detail-kicker').textContent='담당 · '+(n.actor||n.pool);focusConnections(id);body.append(element('h2',n.name.replace(/\n/g,' '),'detail-title'));body.append(element('span',n.actor||n.pool,'actor'));body.append(field('하는 일',n.description));if(n.inputs&&String(n.inputs).trim()){body.append(field('받는 자료',n.inputs));}else{const upstream=[...new Set(edges.filter(e=>e.target===id&&nodeMap.has(e.source)).map(e=>e.source))].map(source=>nodeMap.get(source)).filter(source=>source.outputs&&String(source.outputs).trim());if(upstream.length){body.append(field('앞 업무에서 전달하는 자료',upstream.map(source=>source.name.replace(/\n/g,' ')+'\n'+source.outputs).join('\n\n')));}}body.append(field('다음 업무에 전달할 자료와 확인 결과',n.outputs));if(n.question){const q=questionBox(n.question);if(q)body.append(q);}
for(const [direction,title] of [['previous','앞 업무 · 받는 흐름'],['next','다음 업무 · 전달하는 흐름']]){const list=edges.filter(e=>direction==='next'?e.source===id&&nodeMap.has(e.target):e.target===id&&nodeMap.has(e.source));if(list.length){const box=element('section',undefined,'field');box.append(element('h3',title));for(const e of list){const target=nodeMap.get(direction==='next'?e.target:e.source),b=element('button',undefined,'neighbor');if(e.name)b.append(element('strong',e.name));b.append(document.createTextNode(target.name.replace(/\n/g,' ')));b.append(element('small',target.actor||target.pool));b.onclick=()=>showNode(target.id);box.append(b);}body.append(box);}}const copy=element('button','이 업무 위치 링크 복사','node-link');copy.onclick=async()=>{const url=new URL(location.href);url.hash='node='+encodeURIComponent(id);try{await navigator.clipboard.writeText(url.href);status(location.protocol==='file:'?'위치 링크를 복사했습니다. 로컬 파일로 공유할 때는 이 HTML 파일도 함께 전달하세요.':'같은 업무를 바로 여는 링크를 복사했습니다.');}catch{status('주소창의 링크를 복사하면 이 업무를 다시 열 수 있습니다.');}};body.append(copy);body.append(element('p','위의 편집하기를 누르면 이 흐름을 바로 수정할 수 있습니다. 수정본은 BPMN 파일로 내려받아 보관합니다.','panel-note'));$('detail').hidden=false;mark(n);requestAnimationFrame(updateRoles);if(hash)setHash('node='+encodeURIComponent(id));if(navigate){if(zoom<.7){zoom=1;setSize();document.body.classList.remove('overview');}requestAnimationFrame(()=>scrollPoint(n.x+n.w/2,n.y+n.h/2,'auto'));}status((n.actor||n.pool)+' · '+n.name.replace(/\n/g,' '));$('search-results').hidden=true;return true;}
function goStage(index,{hash=true}={}){const stage=model.layout.stages[index];if(!stage)return;selected=null;focusConnections(null);$('detail').hidden=true;highlight.setAttribute('hidden','');zoom=1;setSize();document.body.classList.remove('overview');const stageX=model.layout.stageBounds?.[index]?.x ?? (250+stage[1]*320);viewport.scrollTo({left:Math.max(0,(stageX-x0)-65),top:Math.max(0,(400-y0)-50),behavior:'auto'});if(hash)setHash('stage='+(index+1));status((index+1)+'구간 · '+stage[0]);updateStage();}
function updateStage(){const x=x0+(viewport.scrollLeft+Math.min(viewport.clientWidth/2,250))/zoom;let i=model.layout.stages.findLastIndex((s,k)=>x>=(model.layout.stageBounds?.[k]?.x ?? (250+s[1]*320))&&(x<(model.layout.stageBounds?.[k]?.endX ?? (250+s[2]*320))||k===model.layout.stages.length-1));if(i<0)i=0;if(i!==activeStage){activeStage=i;[...$('stages').children].forEach((b,k)=>b.classList.toggle('active',k===i));}}
model.layout.stages.forEach((s,i)=>{const b=element('button');b.append(element('span',String(i+1),'stage-number'));b.append(document.createTextNode(s[0]));b.onclick=()=>goStage(i);$('stages').append(b);});
for(const n of nodes){let groups=[...svg.querySelectorAll('[data-element-id]')].filter(el=>el.getAttribute('data-element-id')===n.id&&el.classList.contains('djs-shape'));if(!groups.length){if(!fallbackLayer){fallbackLayer=document.createElementNS(namespace,'g');svg.append(fallbackLayer);}const rect=document.createElementNS(namespace,'rect');for(const[k,v]of Object.entries({x:n.x,y:n.y,width:n.w,height:n.h,fill:'transparent','pointer-events':'all'}))rect.setAttribute(k,v);fallbackLayer.append(rect);groups=[rect];}for(const group of groups){group.setAttribute('data-reader-node',n.id);group.setAttribute('tabindex','0');group.setAttribute('role','button');group.setAttribute('aria-label',(n.actor||'')+' '+n.name.replace(/\n/g,' '));group.addEventListener('click',event=>{event.stopPropagation();showNode(n.id,{navigate:false});});group.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();showNode(n.id,{navigate:false});}});}}
$('close-detail').onclick=()=>{$('detail').hidden=true;focusConnections(null);requestAnimationFrame(updateRoles);};$('overview').onclick=()=>{const scale=Math.min(viewport.clientWidth/W,viewport.clientHeight/H)*.96;setZoom(scale,{x:x0+W/2,y:y0+H/2});status('전체 구조 보기 · 글자를 읽으려면 읽기 크기 또는 업무 구간을 선택하세요.');};$('reading').onclick=()=>{if(selected&&nodeMap.has(selected)){const n=nodeMap.get(selected);setZoom(1,{x:n.x+n.w/2,y:n.y+n.h/2});}else goStage(Math.max(0,activeStage));};$('zoom-in').onclick=()=>setZoom(zoom*1.2);$('zoom-out').onclick=()=>setZoom(zoom/1.2);
$('search').addEventListener('input',()=>{const value=$('search').value.trim().toLocaleLowerCase();const box=$('search-results');box.replaceChildren();if(!value){box.hidden=true;return;}const hits=nodes.filter(n=>[n.name,n.actor,n.description,n.inputs,n.outputs,n.question&&questions.get(n.question)?.text].filter(Boolean).join(' ').toLocaleLowerCase().includes(value));box.append(element('div',hits.length+'개 업무를 찾았습니다.','search-summary'));for(const n of hits.slice(0,25)){const b=element('button',n.name.replace(/\n/g,' '));b.append(element('small',n.actor||n.pool));b.onclick=()=>showNode(n.id);box.append(b);}if(hits.length>25)box.append(element('div','검색어를 더 구체적으로 입력하면 범위를 줄일 수 있습니다.','search-summary'));box.hidden=false;});$('search').addEventListener('keydown',event=>{if(event.key==='Escape')$('search-results').hidden=true;if(event.key==='Enter'){const b=$('search-results').querySelector('button');if(b)b.click();}});document.addEventListener('click',event=>{if(!event.target.closest('.search-wrap'))$('search-results').hidden=true;});
$('questions-button').onclick=()=>{const body=$('detail-content');body.replaceChildren();$('detail-kicker').textContent='초안에서 확인할 사항';body.append(element('h2','확인 필요 '+questions.size+'개','detail-title'));body.append(element('p','질문 아래 업무를 누르면 해당 위치와 설명으로 이동합니다.','panel-note'));for(const q of model.questions){const box=element('section',undefined,'question-item');box.append(element('span',q.id+' · '+q.status));box.append(element('p',q.text));const locations=nodes.filter(n=>n.question===q.id);for(const n of locations){const b=element('button',n.name.replace(/\n/g,' '),'neighbor');b.onclick=()=>showNode(n.id);box.append(b);}body.append(box);}$('detail').hidden=false;};
$('download').onclick=()=>{const bytes=Uint8Array.from(atob($('bpmn-data').textContent.trim()),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='artwork-overview-review-01.bpmn';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);status('원본 BPMN 다운로드를 시작했습니다. 이 HTML의 공유본이 바뀌거나 자동 저장되는 것은 아닙니다.');};
function restore(){const params=new URLSearchParams(location.hash.slice(1));if(params.has('node')&&showNode(params.get('node'),{hash:false}))return;if(params.has('stage')){goStage(Math.max(0,Number(params.get('stage'))-1),{hash:false});return;}goStage(0,{hash:false});}viewport.addEventListener('scroll',()=>{updateStage();updateRoles();},{passive:true});window.addEventListener('resize',updateRoles);window.addEventListener('hashchange',restore);setSize();requestAnimationFrame(restore);window.readerReady=true;
})();</script><script src="./reader-controls.js?v=flow-2"></script></body></html>
