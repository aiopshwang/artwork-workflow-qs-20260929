function setHash(value){const url=new URL(location.href);url.hash=value;history.replaceState(null,'',url);}function field(title,text){const box=element('section',undefined,'field');box.append(element('h3',title));box.append(element('p',text||'초안에 구체적인 자료가 별도 기재되지 않았습니다.',text?'':'empty'));return box;}function mark(n){highlight.hidden=false;highlight.removeAttribute('hidden');for(const[k,v]of Object.entries({x:n.x-8,y:n.y-8,width:n.w+16,height:n.h+16}))highlight.setAttribute(k,v);}

$('close-detail').onclick=()=>{$('detail').hidden=true;focusConnections(null);requestAnimationFrame(updateRoles);};$('overview').onclick=()=>{const scale=Math.min(viewport.clientWidth/W,viewport.clientHeight/H)*.96;setZoom(scale,{x:x0+W/2,y:y0+H/2});status('전체 구조 보기 · 글자를 읽으려면 읽기 크기 또는 업무 구간을 선택하세요.');};$('reading').onclick=()=>{if(selected&&nodeMap.has(selected)){const n=nodeMap.get(selected);setZoom(1,{x:n.x+n.w/2,y:n.y+n.h/2});}else goStage(Math.max(0,activeStage));};$('zoom-in').onclick=()=>setZoom(zoom*1.2);$('zoom-out').onclick=()=>setZoom(zoom/1.2);
$('search').addEventListener('input',()=>{const value=$('search').value.trim().toLocaleLowerCase();const box=$('search-results');box.replaceChildren();if(!value){box.hidden=true;return;}const hits=nodes.filter(n=>[n.name,n.actor,n.description,n.inputs,n.outputs,n.question&&questions.get(n.question)?.text].filter(Boolean).join(' ').toLocaleLowerCase().includes(value));box.append(element('div',hits.length+'개 업무를 찾았습니다.','search-summary'));for(const n of hits.slice(0,25)){const b=element('button',n.name.replace(/\n/g,' '));b.append(element('small',n.actor||n.pool));b.onclick=()=>showNode(n.id);box.append(b);}if(hits.length>25)box.append(element('div','검색어를 더 구체적으로 입력하면 범위를 줄일 수 있습니다.','search-summary'));box.hidden=false;});$('search').addEventListener('keydown',event=>{if(event.key==='Escape')$('search-results').hidden=true;if(event.key==='Enter'){const b=$('search-results').querySelector('button');if(b)b.click();}});document.addEventListener('click',event=>{if(!event.target.closest('.search-wrap'))$('search-results').hidden=true;});
$('questions-button').onclick=()=>{const body=$('detail-content');body.replaceChildren();$('detail-kicker').textContent='초안에서 확인할 사항';body.append(element('h2','확인 필요 '+questions.size+'개','detail-title'));body.append(element('p','질문 아래 업무를 누르면 해당 위치와 설명으로 이동합니다.','panel-note'));for(const q of model.questions){const box=element('section',undefined,'question-item');box.append(element('span',q.id+' · '+q.status));box.append(element('p',q.text));const locations=nodes.filter(n=>n.question===q.id);for(const n of locations){const b=element('button',n.name.replace(/\n/g,' '),'neighbor');b.onclick=()=>showNode(n.id);box.append(b);}body.append(box);}$('detail').hidden=false;};
$('download').onclick=()=>{const bytes=Uint8Array.from(atob($('bpmn-data').textContent.trim()),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='artwork-overview-review-01.bpmn';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);status('원본 BPMN 다운로드를 시작했습니다. 이 HTML의 공유본이 바뀌거나 자동 저장되는 것은 아닙니다.');};
function restore(){const params=new URLSearchParams(location.hash.slice(1));if(params.has('node')&&showNode(params.get('node'),{hash:false}))return;if(params.has('stage')){goStage(Math.max(0,Number(params.get('stage'))-1),{hash:false});return;}goStage(0,{hash:false});}viewport.addEventListener('scroll',()=>{updateStage();updateRoles();},{passive:true});window.addEventListener('resize',updateRoles);window.addEventListener('hashchange',restore);setSize();requestAnimationFrame(restore);window.readerReady=true;
})();</script><script src="./reader-controls.js"></script></body></html>
